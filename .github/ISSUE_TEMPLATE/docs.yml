name: Documentation
description: Inexactitude ou omission dans la documentation
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Fichier ou URL
      placeholder: README.md, FONCTIONNEMENT-APPLICATION.md…
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Écart constaté
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Correction proposée
