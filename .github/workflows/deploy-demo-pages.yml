# Publie demo/ vers la branche gh-pages (GitHub Pages)
name: Deploy demo Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp -a demo/. _site/
          touch _site/.nojekyll
          V="${GITHUB_SHA:0:7}"
          sed -i "s/[?]v=dev/?v=${V}/g" _site/index.html
          # Invalide aussi les @import CSS (sinon le navigateur garde l’ancien thème)
          find _site/css -name '*.css' -print0 | xargs -0 sed -i "s|url(\\./\\([^)]*\\))|url(./\\1?v=${V})|g"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
