# Build client (Electron) sur push main → artefacts + GitHub Release pour mise à jour auto
#
# Publication (Release) : faite UNIQUEMENT ici en CI. Le token doit avoir les droits d'écriture (créer une release).
# - Soit un secret GH_TOKEN (Personal Access Token avec scope "repo") dans Settings > Secrets and variables > Actions.
# - Soit GITHUB_TOKEN (automatique) si le dépôt autorise "Read and write permissions" dans Settings > Actions > General.
# En local : "npm run build:linux" ou "build:prod:linux:local", aucun token nécessaire.
name: Build & Publish Client

on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à builder'
        required: true
        default: 'all'
        type: choice
        options:
          - linux
          - win
          - all
      publier:
        description: 'Publier la release (non : paquets en artefacts seulement, pour une recette)'
        required: true
        default: 'oui'
        type: choice
        options:
          - oui
          - non

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Tests
        run: npm test
      - name: Audit sécurité Electron
        run: node .claude/skills/desk-audit/scripts/check-desktop.mjs
      - name: Hygiène du dépôt
        run: node .claude/skills/desk-audit/scripts/check-repo.mjs

  build-linux:
    # Plus ancien runner maintenu : outils de paquet (fpm, rpmbuild, mksquashfs) anciens. Sur
    # ubuntu-latest (26.04), le mksquashfs d'appimage@1.0.2 impose son libm.so.6 et échoue.
    # La glibc minimale vient d'Electron (binaires précompilés) : mesurée par le job test-maj-deb.
    runs-on: ubuntu-22.04
    needs: checks
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Outil rpmbuild (cible rpm)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Vérifier token de publication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ] && [ -z "${GITHUB_TOKEN}" ]; then
            echo "::error::Aucun token GitHub. Ajoutez un secret GH_TOKEN (PAT avec scope repo) dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Token de publication configuré."

      - name: Build client (Linux)
        working-directory: apps/client
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          # Publication seulement depuis main, jamais avec publier=non (branche de test : toujours never)
          PUBLISH_MODE: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non') && 'always' || 'never' }}
        shell: bash
        run: npx electron-builder --linux --publish="$PUBLISH_MODE"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-linux
          path: |
            apps/client/dist/*.AppImage
            apps/client/dist/*.deb
            apps/client/dist/*.rpm
            apps/client/dist/*.tar.gz
            apps/client/dist/*.yml

  build-windows:
    runs-on: windows-latest
    needs: checks
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'win' || github.event.inputs.platform == 'all'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Vérifier token de publication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN -and -not $env:GITHUB_TOKEN) {
            Write-Error "Aucun token GitHub. Ajoutez un secret GH_TOKEN (PAT avec scope repo) dans Settings > Secrets and variables > Actions."
            exit 1
          }
          echo "Token de publication configuré."

      - name: Build client (Windows)
        working-directory: apps/client
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          # Publication seulement depuis main, jamais avec publier=non (branche de test : toujours never)
          PUBLISH_MODE: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non') && 'always' || 'never' }}
        shell: bash
        run: npx electron-builder --win --publish="$PUBLISH_MODE"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-windows
          path: |
            apps/client/dist/*.exe
            apps/client/dist/*.blockmap
            apps/client/dist/*.yml

  sommes:
    # SHA256SUMS.txt de tous les paquets construits : artefact, et pièce de la release quand elle est publiée.
    needs: [build-linux, build-windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: client-*
          merge-multiple: true
          path: paquets

      - name: Calculer les sommes
        run: |
          cd paquets
          sha256sum -- * | sort -k 2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sommes
          path: SHA256SUMS.txt

      - name: Joindre à la release
        if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release upload "v$(node -p "require('./apps/client/package.json').version")" SHA256SUMS.txt --clobber

  # Recette des paquets Linux, seulement en workflow_dispatch avec publier=non :
  # lecture seule, aucun secret, ne peut pas publier.
  test-paquets:
    needs: build-linux
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:20.04', mode: appimage }
          - { image: 'debian:12', mode: appimage }
          - { image: 'fedora:41', mode: appimage }
          - { image: 'ubuntu:22.04', mode: deb }
          - { image: 'ubuntu:24.04', mode: deb }
          - { image: 'fedora:41', mode: rpm }
          # Rocky Linux 10 (poste d'Alexandre) : AlmaLinux 10, même base RHEL 10
          - { image: 'almalinux:10', mode: rpm }
          - { image: 'almalinux:10', mode: appimage }
    name: test ${{ matrix.mode }} ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-linux
          path: paquets

      - name: Lancer dans le conteneur
        run: >
          docker run --rm -v "$PWD/paquets:/p:ro" -v "$PWD/.github/scripts:/s:ro"
          "${{ matrix.image }}" sh /s/test-paquet-conteneur.sh "${{ matrix.mode }}"

  test-maj-deb:
    needs: build-linux
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-linux
          path: paquets

      - name: Préparer (Xvfb, faux pkexec, scripts des helpers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils binutils
          nohup Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          printf '#!/bin/sh\nexec sudo -n "$@"\n' | sudo tee /usr/local/bin/pkexec > /dev/null
          sudo chmod 755 /usr/local/bin/pkexec
          git show v3.7.2:apps/client/main.js > "$RUNNER_TEMP/main-3.7.2.js"
          node .github/scripts/helpers-maj.cjs ancien "$RUNNER_TEMP/ancien" "$RUNNER_TEMP/main-3.7.2.js"
          node .github/scripts/helpers-maj.cjs nouveau "$RUNNER_TEMP/nouveau"
          chmod +x .github/scripts/*.sh

      - name: glibc minimale requise
        run: |
          cd "$RUNNER_TEMP"
          cp "$GITHUB_WORKSPACE/paquets/workspace.AppImage" . && chmod +x workspace.AppImage
          ./workspace.AppImage --appimage-extract > /dev/null
          for f in squashfs-root/workspace squashfs-root/chrome_crashpad_handler squashfs-root/*.so*; do
            printf '%s : ' "$(basename "$f")"
            objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
          done

      - name: Ubuntu poste de travail (userns restreint par AppArmor, réglage d'Ubuntu 24.04)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          mkdir -p "$RUNNER_TEMP/journaux"
          sysctl kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/journaux/sysctl.txt"

      - name: AppImage et tar.gz, userns restreint
        continue-on-error: true
        run: |
          ls -l /dev/fuse; command -v fusermount fusermount3 || true
          mkdir -p "$RUNNER_TEMP/archive" && tar xzf paquets/workspace.tar.gz -C "$RUNNER_TEMP/archive"
          sandbox=$(ls "$RUNNER_TEMP"/archive/*/chrome-sandbox)
          r=0
          .github/scripts/test-lancement.sh appimage "$RUNNER_TEMP/workspace.AppImage" || r=1
          .github/scripts/test-lancement.sh archive "$RUNNER_TEMP"/archive/*/workspace || r=1
          # Consigne des notes de version pour le tar.gz : bac à sable setuid, comme Chrome
          sudo chown root:root "$sandbox" && sudo chmod 4755 "$sandbox"
          .github/scripts/test-lancement.sh archive-setuid "$RUNNER_TEMP"/archive/*/workspace || r=1
          exit $r

      - name: Mise à jour .deb, helper de la 3.7.2 (reproduction)
        continue-on-error: true
        run: .github/scripts/test-maj-deb.sh paquets/workspace.deb "$RUNNER_TEMP/ancien" ancien "$RUNNER_TEMP/journaux"

      - name: Mise à jour .deb, nouveau helper
        run: .github/scripts/test-maj-deb.sh paquets/workspace.deb "$RUNNER_TEMP/nouveau" nouveau "$RUNNER_TEMP/journaux"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: journaux-maj-deb
          path: ${{ runner.temp }}/journaux

  # Wayland natif sous mutter (compositeur de GNOME) sans écran : 3.8.0 publiée contre cette
  # branche, sur un écran large et sur un écran plus petit que la fenêtre par défaut (1280 x 800).
  # Seulement en workflow_dispatch avec publier=non : lecture seule, aucun secret.
  test-wayland:
    needs: build-linux
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-linux
          path: paquets

      - name: Préparer (mutter, Xvfb, 3.8.0 publiée)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mutter dbus-x11 xvfb x11-utils xwayland
          mutter --version
          curl -fsSL -o "$RUNNER_TEMP/workspace-3.8.0.deb" https://github.com/K0uzia/Tracebay/releases/download/v3.8.0/workspace.deb
          chmod +x .github/scripts/test-wayland.sh

      - name: 3.8.0 publiée sous Wayland (reproduction)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq --reinstall "$RUNNER_TEMP/workspace-3.8.0.deb" > /dev/null
          dbus-run-session -- .github/scripts/test-wayland.sh v380-large 1920x1080 /usr/bin/workspace
          dbus-run-session -- .github/scripts/test-wayland.sh v380-petit 1280x720 /usr/bin/workspace

      - name: Cette branche en Wayland natif (TRACEBAY_OZONE_PLATFORM=wayland)
        run: |
          sudo apt-get install -y -qq --reinstall "$GITHUB_WORKSPACE/paquets/workspace.deb" > /dev/null
          N="env TRACEBAY_OZONE_PLATFORM=wayland /usr/bin/workspace"
          dbus-run-session -- .github/scripts/test-wayland.sh branche-large 1920x1080 $N
          dbus-run-session -- .github/scripts/test-wayland.sh branche-petit 1280x720 $N
          # Session Wayland sans XWayland (pas de DISPLAY) : pas de repli, Wayland natif
          dbus-run-session -- .github/scripts/test-wayland.sh branche-sans-xwayland 1440x900 /usr/bin/workspace

      - name: Cette branche en Wayland natif, essais d'affichage (show immédiat, sans GPU)
        continue-on-error: true
        run: |
          N="env TRACEBAY_OZONE_PLATFORM=wayland"
          dbus-run-session -- .github/scripts/test-wayland.sh branche-show-immediat 1440x900 \
            $N TRACEBAY_FENETRE_SHOW=immediat /usr/bin/workspace
          dbus-run-session -- .github/scripts/test-wayland.sh branche-sans-gpu 1440x900 $N /usr/bin/workspace --disable-gpu

      - name: 'Cette branche, session Wayland avec XWayland (défaut, relance en XWayland, Xvfb)'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/journaux-wayland"
          Xvfb :98 -screen 0 1440x900x24 > /dev/null 2>&1 &
          sleep 2
          LOG="$RUNNER_TEMP/journaux-wayland/app-xwayland.log"
          DISPLAY=:98 XDG_SESSION_TYPE=wayland /usr/bin/workspace > "$LOG" 2>&1 &
          sleep 20
          grep -E 'Fenêtre' "$LOG" || true
          DISPLAY=:98 xwininfo -root -tree | grep -i '"tracebay' | head -n 3
          pgrep -a -x workspace | grep -v -- '--type=' || true
          pkill -x workspace || true
          grep -q 'ozone=x11' "$LOG"

      - name: Rocky Linux 10, ce que tireraient Xwayland et le paquet (dnf --assumeno)
        continue-on-error: true
        run: |
          ls -l paquets/
          docker run --rm -v "$PWD/paquets:/p:ro" rockylinux/rockylinux:10 bash -c '
            cat /etc/rocky-release
            echo "== xorg-x11-server-Xwayland seul"
            dnf install --assumeno xorg-x11-server-Xwayland 2>&1 | grep -E "^(Install|Upgrade) |Total|Installed size|Taille" || true
            echo "== workspace.rpm, dépendances faibles comprises (défaut de dnf)"
            dnf install --assumeno /p/workspace.rpm 2>&1 | grep -E "^(Install|Upgrade) |Total|Installed size|Weak|Taille" || true
            echo "== workspace.rpm, sans dépendances faibles"
            dnf install --assumeno --setopt=install_weak_deps=False /p/workspace.rpm 2>&1 | grep -E "^(Install|Upgrade) |Total|Installed size|Taille" || true'

      - name: AlmaLinux 10 (base de Rocky 10, mutter 47), Wayland natif, avec et sans GPU
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/journaux-el10"
          docker run --rm -e RUNNER_TEMP=/j -v "$RUNNER_TEMP/journaux-el10:/j/journaux-wayland" \
            -v "$PWD/paquets:/p:ro" -v "$PWD/.github/scripts:/s:ro" almalinux:10 bash -c '
              dnf install -y -q mutter dbus-daemon dbus-tools /p/workspace.rpm > /dev/null || exit 1
              ldd /opt/Tracebay/workspace | grep 'not found' || echo 'ldd : aucune bibliothèque manquante'
              rpm -q xorg-x11-server-Xwayland || true
              N="env TRACEBAY_OZONE_PLATFORM=wayland /usr/bin/workspace --no-sandbox"
              r=0
              dbus-run-session -- bash /s/test-wayland.sh el10-natif 1440x900 $N || r=1
              dbus-run-session -- bash /s/test-wayland.sh el10-natif-sans-gpu 1440x900 $N --disable-gpu || r=1
              exit $r'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: journaux-wayland
          path: |
            ${{ runner.temp }}/journaux-wayland
            ${{ runner.temp }}/journaux-el10
