# Build client (Electron) sur push main → artefacts + GitHub Release pour mise à jour auto
#
# Publication (Release) : faite UNIQUEMENT ici en CI. Le token doit avoir les droits d'écriture (créer une release).
# - Soit un secret GH_TOKEN (Personal Access Token avec scope "repo") dans Settings > Secrets and variables > Actions.
# - Soit GITHUB_TOKEN (automatique) si le dépôt autorise "Read and write permissions" dans Settings > Actions > General.
# En local : "npm run build:linux" ou "build:prod:linux:local", aucun token nécessaire.
name: Build & Publish Client

on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à builder'
        required: true
        default: 'all'
        type: choice
        options:
          - linux
          - win
          - all
      publier:
        description: 'Publier la release (non : paquets en artefacts seulement, pour une recette)'
        required: true
        default: 'oui'
        type: choice
        options:
          - oui
          - non

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Tests
        run: npm test
      - name: Audit sécurité Electron
        run: node .claude/skills/desk-audit/scripts/check-desktop.mjs
      - name: Hygiène du dépôt
        run: node .claude/skills/desk-audit/scripts/check-repo.mjs

  build-linux:
    # Plus ancien runner maintenu : outils de paquet (fpm, rpmbuild, mksquashfs) anciens. Sur
    # ubuntu-latest (26.04), le mksquashfs d'appimage@1.0.2 impose son libm.so.6 et échoue.
    # La glibc minimale vient d'Electron (binaires précompilés) : mesurée par le job test-maj-deb.
    runs-on: ubuntu-22.04
    needs: checks
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Outil rpmbuild (cible rpm)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Vérifier token de publication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ] && [ -z "${GITHUB_TOKEN}" ]; then
            echo "::error::Aucun token GitHub. Ajoutez un secret GH_TOKEN (PAT avec scope repo) dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Token de publication configuré."

      - name: Build client (Linux)
        working-directory: apps/client
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          # Publication seulement depuis main, jamais avec publier=non (branche de test : toujours never)
          PUBLISH_MODE: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non') && 'always' || 'never' }}
        shell: bash
        run: npx electron-builder --linux --publish="$PUBLISH_MODE"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: |
            apps/client/dist/*.AppImage
            apps/client/dist/*.deb
            apps/client/dist/*.rpm
            apps/client/dist/*.tar.gz
            apps/client/dist/*.yml

  build-windows:
    runs-on: windows-latest
    needs: checks
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'win' || github.event.inputs.platform == 'all'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Vérifier token de publication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN -and -not $env:GITHUB_TOKEN) {
            Write-Error "Aucun token GitHub. Ajoutez un secret GH_TOKEN (PAT avec scope repo) dans Settings > Secrets and variables > Actions."
            exit 1
          }
          echo "Token de publication configuré."

      - name: Build client (Windows)
        working-directory: apps/client
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          # Publication seulement depuis main, jamais avec publier=non (branche de test : toujours never)
          PUBLISH_MODE: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non') && 'always' || 'never' }}
        shell: bash
        run: npx electron-builder --win --publish="$PUBLISH_MODE"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: |
            apps/client/dist/*.exe
            apps/client/dist/*.blockmap
            apps/client/dist/*.yml

  sommes:
    # SHA256SUMS.txt de tous les paquets construits : artefact, et pièce de la release quand elle est publiée.
    needs: [build-linux, build-windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: paquets

      - name: Calculer les sommes
        run: |
          cd paquets
          sha256sum -- * | sort -k 2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sommes
          path: SHA256SUMS.txt

      - name: Joindre à la release
        if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release upload "v$(node -p "require('./apps/client/package.json').version")" SHA256SUMS.txt --clobber

  # Recette des paquets Linux, seulement en workflow_dispatch avec publier=non :
  # lecture seule, aucun secret, ne peut pas publier.
  test-paquets:
    needs: build-linux
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:20.04', mode: appimage }
          - { image: 'debian:12', mode: appimage }
          - { image: 'fedora:41', mode: appimage }
          - { image: 'ubuntu:22.04', mode: deb }
          - { image: 'ubuntu:24.04', mode: deb }
          - { image: 'fedora:41', mode: rpm }
    name: test ${{ matrix.mode }} ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: client-linux
          path: paquets

      - name: Lancer dans le conteneur
        run: >
          docker run --rm -v "$PWD/paquets:/p:ro" -v "$PWD/.github/scripts:/s:ro"
          "${{ matrix.image }}" sh /s/test-paquet-conteneur.sh "${{ matrix.mode }}"

  test-maj-deb:
    needs: build-linux
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publier == 'non'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: client-linux
          path: paquets

      - name: Préparer (Xvfb, faux pkexec, scripts des helpers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils binutils
          nohup Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          printf '#!/bin/sh\nexec sudo -n "$@"\n' | sudo tee /usr/local/bin/pkexec > /dev/null
          sudo chmod 755 /usr/local/bin/pkexec
          git show v3.7.2:apps/client/main.js > "$RUNNER_TEMP/main-3.7.2.js"
          node .github/scripts/helpers-maj.cjs ancien "$RUNNER_TEMP/ancien" "$RUNNER_TEMP/main-3.7.2.js"
          node .github/scripts/helpers-maj.cjs nouveau "$RUNNER_TEMP/nouveau"
          chmod +x .github/scripts/*.sh

      - name: glibc minimale requise
        run: |
          cd "$RUNNER_TEMP"
          cp "$GITHUB_WORKSPACE/paquets/workspace.AppImage" . && chmod +x workspace.AppImage
          ./workspace.AppImage --appimage-extract > /dev/null
          for f in squashfs-root/workspace squashfs-root/chrome_crashpad_handler squashfs-root/*.so*; do
            printf '%s : ' "$(basename "$f")"
            objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
          done

      - name: Ubuntu poste de travail (userns restreint par AppArmor, réglage d'Ubuntu 24.04)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          mkdir -p "$RUNNER_TEMP/journaux"
          sysctl kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/journaux/sysctl.txt"

      - name: AppImage et tar.gz, userns restreint
        continue-on-error: true
        run: |
          ls -l /dev/fuse; command -v fusermount fusermount3 || true
          mkdir -p "$RUNNER_TEMP/archive" && tar xzf paquets/workspace.tar.gz -C "$RUNNER_TEMP/archive"
          sandbox=$(ls "$RUNNER_TEMP"/archive/*/chrome-sandbox)
          r=0
          .github/scripts/test-lancement.sh appimage "$RUNNER_TEMP/workspace.AppImage" || r=1
          .github/scripts/test-lancement.sh archive "$RUNNER_TEMP"/archive/*/workspace || r=1
          # Consigne des notes de version pour le tar.gz : bac à sable setuid, comme Chrome
          sudo chown root:root "$sandbox" && sudo chmod 4755 "$sandbox"
          .github/scripts/test-lancement.sh archive-setuid "$RUNNER_TEMP"/archive/*/workspace || r=1
          exit $r

      - name: Mise à jour .deb, helper de la 3.7.2 (reproduction)
        continue-on-error: true
        run: .github/scripts/test-maj-deb.sh paquets/workspace.deb "$RUNNER_TEMP/ancien" ancien "$RUNNER_TEMP/journaux"

      - name: Mise à jour .deb, nouveau helper
        run: .github/scripts/test-maj-deb.sh paquets/workspace.deb "$RUNNER_TEMP/nouveau" nouveau "$RUNNER_TEMP/journaux"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-maj-deb
          path: ${{ runner.temp }}/journaux
