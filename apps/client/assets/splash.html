<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1d2329;
    color: #f4f1ea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .logo-img {
    width: 280px;
    height: auto;
    margin-bottom: 1.25rem;
  }
  .tagline { font-size: 0.9rem; opacity: 0.75; margin-bottom: 1.75rem; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(244, 241, 234, 0.2);
    border-top-color: #e39b00;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .message { margin-top: 1.25rem; font-size: 0.85rem; opacity: 0.9; }
  .progress-wrap { margin-top: 1rem; width: 100%; max-width: 260px; display: none; }
  .progress-wrap.visible { display: block; }
  .progress-bar { height: 8px; background: rgba(244, 241, 234, 0.2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: #e39b00; border-radius: 4px; transition: width 0.2s ease; }
</style>
</head>
<body>
  <img class="logo-img" src="./brand/logos/svg/tracebay-logo-fond-sombre.svg" alt="Tracebay">
  <div class="tagline">By K0uzia</div>
  <div class="spinner"></div>
  <p class="message">Chargement en cours…</p>
  <div class="progress-wrap" id="splash-progress">
    <div class="progress-bar"><div class="progress-fill" id="splash-progress-fill"></div></div>
  </div>
</body>
</html>
